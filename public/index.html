<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novovet | Portal Auto-Atención</title>
  <!-- Tipografía Inter idéntica al catálogo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --bg-body: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { 
      background-color: var(--bg-body); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Tarjeta con los bordes y sombras del catálogo */
    .card { 
      background: var(--surface); 
      padding: 36px 32px; 
      border-radius: 20px; 
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
      text-align: center; 
      max-width: 420px; 
      width: 100%; 
    }

    /* Contenedor del Logo idéntico al Header del catálogo */
    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 6px 16px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }
    .logo-container img {
      height: 100%;
      object-fit: contain;
    }

    .brand-title { 
      font-size: 18px; 
      font-weight: 800; 
      color: var(--primary-dark);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .subtitle { 
      color: var(--text-muted); 
      font-size: 13px; 
      font-weight: 500;
      margin-bottom: 24px; 
    }

    /* Estilos del Input de búsqueda */
    input { 
      width: 100%; 
      padding: 14px 18px; 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      font-size: 15px; 
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 16px; 
      outline: none; 
      background: #f8fafc;
      transition: all 0.2s ease;
    }
    input:focus { 
      border-color: var(--primary); 
      background: white;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1); 
    }

    /* Botón azul corporativo con degradado */
    button { 
      width: 100%; 
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); 
      color: white; 
      border: none; 
      padding: 14px; 
      border-radius: 12px; 
      font-size: 14px; 
      font-weight: 800; 
      cursor: pointer; 
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
    }
    button:hover { 
      background: var(--primary-dark); 
      transform: translateY(-1px);
    }
    button:active {
      transform: scale(0.98);
    }

    /* Mensaje de error */
    .error { 
      color: var(--danger); 
      background-color: var(--danger-bg);
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px; 
      font-weight: 600;
      margin-top: 16px; 
      display: none; 
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logo -->
    <div class="logo-container">
      <img src="/Logo.png" alt="Business Veterinary Logo" onerror="this.parentElement.style.display='none'">
    </div>

    <div class="brand-title">COLCHAGUA – NOVOVET</div>
    <div class="subtitle">Consulta de Clientes / Vendedor</div>
    
    <form id="searchForm">
      <input type="text" id="rutInput" placeholder="Ingresa RUT del Cliente" required autofocus autocomplete="off">
      <button type="submit">VER CATÁLOGO CLIENTE</button>
    </form>
    
    <div id="errorMsg" class="error">⚠️ RUT no encontrado. Revisa e intenta de nuevo.</div>
  </div>

  <script>
    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rut = document.getElementById('rutInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      try {
        const response = await fetch(`/api/catalogo/${rut}`);
        if (!response.ok) throw new Error('Cliente no existe');
        
        // Guardar RUT en memoria local y redireccionar a la pantalla del catálogo
        localStorage.setItem('clienteRut', rut);
        window.location.href = '/catalogo.html';
      } catch (err) {
        errorMsg.style.display = 'block';
      }
    });
  </script>

</body>
</html>
